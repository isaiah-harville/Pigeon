[package]
name = "pigeon-cli"
version = "0.1.1"
edition = "2021"
description = "Terminal Pigeon client: end-to-end-encrypted direct messaging over federated zero-knowledge relays."
license = "AGPL-3.0-only"
repository = "https://github.com/isaiah-harville/Pigeon"
publish = false

[[bin]]
name = "pigeon"
path = "src/main.rs"

[dependencies]
pigeon-core = { version = "=0.2.2", path = "../pigeon-core" }
pigeon-mesh = { version = "=0.2.0", path = "../pigeon-mesh" }
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite enables no rustls crypto backend; select ring (the backend
# the relay already uses) explicitly so a standalone build can make TLS calls.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
zeroize = { version = "1", features = ["zeroize_derive"] }
clap = { version = "4", features = ["derive", "env"] }
# Sealing at rest: XChaCha20-Poly1305 (already in the tree via OpenMLS's
# RustCrypto provider) under a key stretched from the passphrase with Argon2id.
chacha20poly1305 = "0.10"
argon2 = "0.5"
rpassword = "7"

[dev-dependencies]
tempfile = "3"
