name: Release versions

on:
  pull_request:
    branches: [main]
    paths:
      - "Pigeon/Pigeon/**"
      - "Pigeon/Pigeon.xcodeproj/**"
      - "Pigeon/PigeonFFI/**"
      - "Pigeon/VERSION"
      - "site/**"
      - "proto/**"
      - "pigeon-core/**"
      - "pigeon-mesh/**"
      - "pigeon-ffi/**"
      - "pigeon-relay/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/scripts/check-version*.sh"
      - ".github/scripts/relay-image-version.sh"
      - ".github/scripts/website-image-version.sh"
      - ".github/workflows/relay.yml"
      - ".github/workflows/swift.yml"
      - ".github/workflows/website.yml"
      - ".github/workflows/release-versions.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check component versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate declared versions
        run: bash .github/scripts/check-versions.sh

      - name: Require version bumps for component changes
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-version-bumps.sh "${{ github.event.pull_request.base.sha }}"
