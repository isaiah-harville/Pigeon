name: pigeon-relay

on:
  push:
    branches: [main]
    paths: ["pigeon-relay/**", "Cargo.toml", "Cargo.lock", ".github/workflows/relay.yml"]
  pull_request:
    branches: [main]
    paths: ["pigeon-relay/**", "Cargo.toml", "Cargo.lock", ".github/workflows/relay.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pigeon/relay

jobs:
  check:
    name: Check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-crate-ci
        with:
          package: pigeon-relay

  image:
    name: Build & push image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image version
        id: version
        run: bash .github/scripts/relay-image-version.sh "${{ github.event.before }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Main always refreshes `latest`. A changed relay package version also
          # publishes its immutable image tag without requiring a Git tag.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.publish_version == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pigeon-relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Don't publish provenance/SBOM attestations — they show up as extra
          # "untagged" manifests in GHCR. Keep the registry to just the tagged
          # multi-arch image.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prune orphaned untagged versions (e.g. the digest the previous `latest`
      # pointed at). Multi-arch aware: it keeps the per-platform child manifests
      # that the current tags still reference, deleting only true orphans.
      - name: Delete untagged versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: ${{ github.repository_owner }}
          packages: pigeon/relay
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-untagged: true

  image-check:
    name: Validate image
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: pigeon-relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
