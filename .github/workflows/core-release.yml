name: Rust core release

on:
  push:
    tags: ["pigeon-core-v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build reproducible release artifacts
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/check-versions.sh "${GITHUB_REF_NAME}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      - name: Install protobuf tooling
        run: brew install protobuf swift-protobuf

      - name: Test locked Rust workspace
        run: cargo test --workspace --locked

      - name: Build PigeonFFI XCFramework
        run: bash pigeon-ffi/build-xcframework.sh

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#pigeon-core-v}"
          mkdir -p dist
          tar -czf "dist/pigeon-rust-workspace-${version}.tar.gz" \
            Cargo.toml Cargo.lock proto pigeon-core pigeon-mesh pigeon-ffi pigeon-relay
          ditto -c -k --sequesterRsrc --keepParent \
            Pigeon/PigeonFFI/PigeonFFIBindings.xcframework \
            "dist/PigeonFFIBindings-${version}.xcframework.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            Pigeon/PigeonFFI/Sources/PigeonFFI/Generated \
            "dist/PigeonFFI-Swift-bindings-${version}.zip"
          cd dist
          shasum -a 256 ./* > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
