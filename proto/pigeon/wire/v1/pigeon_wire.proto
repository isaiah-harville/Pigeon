syntax = "proto3";

package pigeon.wire.v1;

message IdentityBundle {
  bytes identity_key = 1;
  bytes curve_identity_key = 2;
  bytes binding_signature = 3;
}

message PrekeyBundle {
  IdentityBundle identity = 1;
  bytes prekey = 2;
  bytes prekey_signature = 3;
  bool one_time = 4;
}

message OlmMessage {
  uint32 message_type = 1;
  bytes ciphertext = 2;
}

// What an initiator transmits so the recipient can stand up the matching
// session: the initiator's identity bundle (verified against its safety number
// before the session is trusted) and the first Olm pre-key message. This is the
// single blob carried in an X3DH_INIT envelope.
message Initiation {
  IdentityBundle identity = 1;
  OlmMessage message = 2;
}

enum EnvelopeType {
  ENVELOPE_TYPE_UNSPECIFIED = 0;
  ENVELOPE_TYPE_HANDSHAKE = 1;
  ENVELOPE_TYPE_MESSAGE = 2;
  ENVELOPE_TYPE_REHANDSHAKE_REQUEST = 3;
  ENVELOPE_TYPE_ACK = 4;
  ENVELOPE_TYPE_CONTROL = 5;
  ENVELOPE_TYPE_X3DH_INIT = 6;
}

message SessionEnvelope {
  uint32 version = 1;
  EnvelopeType type = 2;
  bytes sender = 3;
  bytes recipient = 4;
  bytes payload = 5;
}

message ContactCard {
  uint32 version = 1;
  IdentityBundle identity = 2;
  string name = 3;
  repeated string relay_urls = 4;
  bytes relay_signature = 5;
  bytes prekey_bundle = 6;
}

message X3DHPrekeyBundle {
  IdentityBundle identity = 1;
  uint32 signed_prekey_id = 2;
  bytes signed_prekey = 3;
  bytes signed_prekey_signature = 4;
  optional uint32 one_time_prekey_id = 5;
  bytes one_time_prekey = 6;
  bytes one_time_prekey_signature = 7;
}

message X3DHInitiation {
  IdentityBundle initiator_identity = 1;
  bytes ephemeral_key = 2;
  uint32 signed_prekey_id = 3;
  optional uint32 one_time_prekey_id = 4;
}

message RatchetHeader {
  bytes dh_public = 1;
  uint32 previous_chain_length = 2;
  uint32 message_number = 3;
}

message RatchetMessage {
  RatchetHeader header = 1;
  bytes ciphertext = 2;
}

message AppMessagePayload {
  string id = 1;
  string text = 2;
  string reply_snippet = 3;
  double sent_at_unix = 4;
}

message ReactionPayload {
  string message_id = 1;
  string emoji = 2;
}

message ClientCommand {
  uint32 version = 1;
  string command_id = 2;
  oneof body {
    CreateGroup create_group = 10;
    SendGroupMessage send_group_message = 11;
    ApplyInbound apply_inbound = 12;
    ChangeGroupPolicy change_group_policy = 13;
  }
}

message CreateGroup {
  string name = 1;
  repeated bytes member_identities = 2;
  string relay_url = 3;
  bool mesh_enabled = 4;
}

message SendGroupMessage {
  bytes group_id = 1;
  string message_id = 2;
  bytes body = 3;
  string reply_to_message_id = 4;
}

message ApplyInbound {
  OutboundKind kind = 1;
  bytes payload = 2;
}

message ChangeGroupPolicy {
  bytes group_id = 1;
  GroupPolicyChangeKind kind = 2;
  bytes subject_identity = 3;
  string string_value = 4;
  bool bool_value = 5;
}

enum GroupPolicyChangeKind {
  GROUP_POLICY_CHANGE_KIND_UNSPECIFIED = 0;
  GROUP_POLICY_CHANGE_KIND_MEMBER_ADDED = 1;
  GROUP_POLICY_CHANGE_KIND_MEMBER_REMOVED = 2;
  GROUP_POLICY_CHANGE_KIND_MEMBER_LEFT = 3;
  GROUP_POLICY_CHANGE_KIND_ADMIN_PROMOTED = 4;
  GROUP_POLICY_CHANGE_KIND_ADMIN_DEMOTED = 5;
  GROUP_POLICY_CHANGE_KIND_NAME_CHANGED = 6;
  GROUP_POLICY_CHANGE_KIND_MESH_CHANGED = 7;
  GROUP_POLICY_CHANGE_KIND_RELAY_CHANGED = 8;
  GROUP_POLICY_CHANGE_KIND_DISSOLVED = 9;
}

message AppEvent {
  uint32 version = 1;
  string event_id = 2;
  oneof body {
    GroupCreated group_created = 20;
    GroupMessageReceived group_message_received = 21;
    GroupPolicyChanged group_policy_changed = 22;
    GroupDeliveryChanged group_delivery_changed = 23;
    GroupSecurityWarning group_security_warning = 24;
  }
}

message GroupCreated {
  bytes group_id = 1;
  bytes owner_identity = 2;
  string name = 3;
  string relay_url = 4;
  bool mesh_enabled = 5;
  uint64 epoch = 6;
  uint64 policy_revision = 7;
}

message GroupMessageReceived {
  bytes group_id = 1;
  string message_id = 2;
  bytes sender_identity = 3;
  bytes body = 4;
  string reply_to_message_id = 5;
  uint64 epoch = 6;
}

message GroupPolicyChanged {
  GroupPolicyChangeKind kind = 1;
  bytes group_id = 2;
  bytes actor_identity = 3;
  bytes subject_identity = 4;
  uint64 epoch = 5;
  uint64 policy_revision = 6;
  string name = 7;
  bool mesh_enabled = 8;
  string relay_url = 9;
}

enum GroupDeliveryState {
  GROUP_DELIVERY_STATE_UNSPECIFIED = 0;
  GROUP_DELIVERY_STATE_PENDING = 1;
  GROUP_DELIVERY_STATE_SENT = 2;
  GROUP_DELIVERY_STATE_DELIVERED = 3;
  GROUP_DELIVERY_STATE_BLOCKED = 4;
}

message GroupDeliveryChanged {
  bytes group_id = 1;
  string message_id = 2;
  GroupDeliveryState state = 3;
  uint64 epoch = 4;
}

message GroupSecurityWarning {
  bytes group_id = 1;
  uint32 code = 2;
  bytes evidence_id = 3;
  uint64 epoch = 4;
}

enum OutboundKind {
  OUTBOUND_KIND_UNSPECIFIED = 0;
  OUTBOUND_KIND_PAIRWISE = 1;
  OUTBOUND_KIND_GROUP_MESSAGE = 2;
  OUTBOUND_KIND_GROUP_COORDINATOR = 3;
  OUTBOUND_KIND_KEY_PACKAGE_REQUEST = 4;
  OUTBOUND_KIND_MESH = 5;
}

message OutboundItem {
  string item_id = 1;
  OutboundKind kind = 2;
  string relay_url = 3;
  bytes destination = 4;
  bytes payload = 5;
}

message ClientOutput {
  uint64 checkpoint_generation = 1;
  repeated AppEvent events = 2;
  repeated OutboundItem outbound = 3;
}

// Internal checkpoint schema. The bytes are always sealed by the platform
// storage boundary before durable replacement.
message ClientCheckpoint {
  uint32 version = 1;
  uint64 generation = 2;
  repeated string applied_command_ids = 3;
  repeated StoredGroup groups = 4;
}

message StoredGroup {
  bytes group_id = 1;
  bytes owner_identity = 2;
  string name = 3;
  repeated bytes member_identities = 4;
  string relay_url = 5;
  bool mesh_enabled = 6;
  uint64 epoch = 7;
  uint64 policy_revision = 8;
}
