syntax = "proto3";

package pigeon.wire.v1;

import "pigeon/wire/v1/group.proto";
import "pigeon/wire/v1/pairwise.proto";

message ClientCommand {
  uint32 version = 1;
  string command_id = 2;
  oneof body {
    CreateGroup create_group = 10;
    SendGroupMessage send_group_message = 11;
    ApplyInbound apply_inbound = 12;
    ChangeGroupPolicy change_group_policy = 13;
    AcknowledgeEffects acknowledge_effects = 14;
    EnsurePairwiseAccount ensure_pairwise_account = 15;
    RegisterPairwiseContact register_pairwise_contact = 16;
    SendPairwiseControl send_pairwise_control = 17;
    SendDirectApplication send_direct_application = 18;
    SetPairwiseRelationship set_pairwise_relationship = 19;
    RemovePairwiseContact remove_pairwise_contact = 20;
    MigrateLegacyPairwiseState migrate_legacy_pairwise_state = 21;
    ConfirmGroupRelayAuthorization confirm_group_relay_authorization = 22;
  }
}

// Creates the core-owned Olm account if it does not already exist. The public
// signed prekey is exposed only through ClientSnapshot after this transaction
// has durably persisted the matching private account state.
message EnsurePairwiseAccount {}

message RegisterPairwiseContact {
  bytes prekey_bundle = 1;
  string relay_url = 2;
  PairwiseRelationship relationship = 3;
}

enum PairwiseRelationship {
  PAIRWISE_RELATIONSHIP_UNSPECIFIED = 0;
  PAIRWISE_RELATIONSHIP_CONTACT = 1;
  PAIRWISE_RELATIONSHIP_OUTGOING_REQUEST = 2;
  PAIRWISE_RELATIONSHIP_INCOMING_REQUEST = 3;
}

message SetPairwiseRelationship {
  bytes identity = 1;
  PairwiseRelationship relationship = 2;
}

message RemovePairwiseContact {
  bytes identity = 1;
}

// One-time compatibility bridge for checkpoints written before pairwise state
// moved behind PigeonClient. The opaque vodozemac pickles are decoded and
// canonicalized by pigeon-core in the same transaction that installs them.
message MigrateLegacyPairwiseState {
  uint32 format_version = 1;
  bytes account_state = 2;
  bytes fallback_key = 3;
  repeated LegacyPairwiseSession sessions = 4;
}

message LegacyPairwiseSession {
  bytes remote_identity = 1;
  bytes state = 2;
}

message SendPairwiseControl {
  bytes recipient_identity = 1;
  OutboundKind content_kind = 2;
  bytes payload = 3;
}

message SendDirectApplication {
  bytes recipient_identity = 1;
  DirectApplication application = 2;
  bool local_only = 3;
  bytes sender_contact_card = 4;
}

message DirectApplicationReceived {
  bytes sender_identity = 1;
  DirectApplication application = 2;
  bytes sender_contact_card = 3;
}

message CreateGroup {
  string name = 1;
  repeated bytes member_identities = 2;
  string relay_url = 3;
  bool mesh_enabled = 4;
  bytes coordinator_public_key = 5;
}

message SendGroupMessage {
  bytes group_id = 1;
  string message_id = 2;
  bytes body = 3;
  string reply_to_message_id = 4;
  int64 sender_timestamp_ms = 5;
}

message ApplyInbound {
  OutboundKind kind = 1;
  bytes payload = 2;
  string request_id = 3;
}

message ChangeGroupPolicy {
  bytes group_id = 1;
  GroupPolicyChangeKind kind = 2;
  bytes subject_identity = 3;
  string string_value = 4;
  bool bool_value = 5;
}

message AcknowledgeEffects {
  repeated string outbound_item_ids = 1;
  repeated string event_ids = 2;
}

// Confirms that the host completed a relay challenge using the capability for
// this exact authorization generation. This releases policy events held on
// non-admin devices until the relay has installed an admin's replacement set.
message ConfirmGroupRelayAuthorization {
  bytes group_id = 1;
  bytes capability_id = 2;
}

message AppEvent {
  uint32 version = 1;
  string event_id = 2;
  oneof body {
    GroupCreated group_created = 20;
    GroupMessageReceived group_message_received = 21;
    GroupPolicyChanged group_policy_changed = 22;
    GroupDeliveryChanged group_delivery_changed = 23;
    GroupSecurityWarning group_security_warning = 24;
    GroupReactionReceived group_reaction_received = 25;
    DirectApplicationReceived direct_application_received = 26;
  }
}

enum OutboundKind {
  OUTBOUND_KIND_UNSPECIFIED = 0;
  OUTBOUND_KIND_PAIRWISE = 1;
  OUTBOUND_KIND_GROUP_MESSAGE = 2;
  OUTBOUND_KIND_GROUP_COORDINATOR = 3;
  OUTBOUND_KIND_GROUP_JOIN_REQUEST = 4;
  OUTBOUND_KIND_MESH = 5;
  OUTBOUND_KIND_GROUP_JOIN_MATERIAL = 6;
  OUTBOUND_KIND_GROUP_WELCOME = 7;
  OUTBOUND_KIND_GROUP_RELAY_REGISTRATION = 8;
  OUTBOUND_KIND_GROUP_RELAY_CONTROL = 9;
  OUTBOUND_KIND_GROUP_LEAVE_PROPOSAL = 10;
}

message OutboundItem {
  string item_id = 1;
  OutboundKind kind = 2;
  string relay_url = 3;
  bytes destination = 4;
  bytes payload = 5;
  bool local_only = 6;
}

message ClientOutput {
  uint64 checkpoint_generation = 1;
  repeated AppEvent events = 2;
  repeated OutboundItem outbound = 3;
}

// Read-only application projection. Hosts rebuild their local UI state from
// this after loading a core checkpoint, avoiding a second crash-sensitive
// source of truth for group membership and relay authorization.
message ClientSnapshot {
  uint64 checkpoint_generation = 1;
  repeated GroupState groups = 2;
  repeated OutboundItem pending_outbound = 3;
  repeated AppEvent pending_events = 4;
  bytes pairwise_prekey_bundle = 5;
  repeated PairwiseContactState pairwise_contacts = 6;
}

message PairwiseContactState {
  bytes identity = 1;
  PairwiseRelationship relationship = 2;
  bool introduction_received = 3;
  bool introduction_sent = 4;
}

message GroupState {
  bytes group_id = 1;
  bytes owner_identity = 2;
  repeated bytes admin_identities = 3;
  repeated bytes member_identities = 4;
  string name = 5;
  string relay_url = 6;
  bytes coordination_id = 7;
  bool mesh_enabled = 8;
  uint64 epoch = 9;
  uint64 policy_revision = 10;
  bool dissolved = 11;
  bytes capability_public_key = 12;
  bytes coordinator_public_key = 13;
  bytes capability_id = 14;
}

message ClientCheckpoint {
  uint32 version = 1;
  uint64 generation = 2;
  repeated string applied_command_ids = 3;
  repeated StoredGroup groups = 4;
  bytes openmls_checkpoint = 5;
  repeated PendingGroupCreation pending_group_creations = 6;
  repeated bytes consumed_key_package_hashes = 7;
  repeated ProcessedGroupMessage processed_group_messages = 8;
  repeated StoredDeliveryLedger delivery_ledgers = 9;
  repeated BufferedGroupMessage buffered_group_messages = 10;
  repeated PendingGroupMutation pending_group_mutations = 11;
  repeated PendingGroupAddition pending_group_additions = 12;
  repeated OutboundItem pending_outbound = 13;
  repeated AppEvent pending_events = 14;
  bytes pairwise_account_state = 15;
  bytes pairwise_fallback_key = 16;
  repeated StoredPairwiseContact pairwise_contacts = 17;
  repeated StoredPairwiseSession pairwise_sessions = 18;
  repeated bytes consumed_pairwise_envelope_hashes = 19;
  repeated DeferredAppEvent deferred_events = 20;
}

// A host-visible event held until either a security-critical outbound effect
// is acknowledged or a non-admin proves that the replacement relay generation
// is active. active_capability_id keeps an admin on the generation authorized
// to perform a pending replacement; release_capability_id identifies the new
// generation a non-admin must authenticate.
message DeferredAppEvent {
  string outbound_item_id = 1;
  bytes group_id = 2;
  bytes active_capability_id = 3;
  AppEvent event = 4;
  bytes release_capability_id = 5;
}

message StoredPairwiseContact {
  bytes identity = 1;
  bytes prekey_bundle = 2;
  string relay_url = 3;
  PairwiseRelationship relationship = 4;
  bool introduction_received = 5;
  bool introduction_sent = 6;
}

message StoredPairwiseSession {
  bytes remote_identity = 1;
  bytes state = 2;
}

message PendingGroupCreation {
  string command_id = 1;
  string name = 2;
  repeated bytes member_identities = 3;
  string relay_url = 4;
  bool mesh_enabled = 5;
  repeated bytes join_materials = 6;
  repeated string join_request_ids = 7;
  bytes coordinator_public_key = 8;
  bytes group_id = 9;
  bytes coordination_id = 10;
}

message ProcessedGroupMessage {
  bytes group_id = 1;
  bytes message_id = 2;
}

message StoredDeliveryLedger {
  bytes group_id = 1;
  bytes message_id = 2;
  uint64 epoch = 3;
  bytes original_sender_identity = 4;
  repeated bytes intended_identities = 5;
  repeated bytes acknowledged_identities = 6;
  bool sent = 7;
  GroupDeliveryState terminal_state = 8;
}

message BufferedGroupMessage {
  bytes group_id = 1;
  uint64 epoch = 2;
  bytes message_id = 3;
  bytes ciphertext = 4;
}

message PendingGroupMutation {
  bytes group_id = 1;
  uint64 base_epoch = 2;
  bytes commit = 3;
  bytes next_policy = 4;
  GroupPolicyChangeKind event_kind = 5;
  bytes actor_identity = 6;
  bytes subject_identity = 7;
  bytes welcome = 8;
  bytes welcome_destination = 9;
  bytes coordinator_candidate = 10;
}

message PendingGroupAddition {
  string request_id = 1;
  bytes group_id = 2;
  bytes member_identity = 3;
}
