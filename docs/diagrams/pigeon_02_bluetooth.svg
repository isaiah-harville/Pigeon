<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Olm session establishment and direct messaging over Bluetooth mesh</title>
  <desc id="desc">A sequence diagram. Alice derives an outbound Olm session from Bob's published prekeys, sends a pre-key initiation as opaque ciphertext over Bluetooth mesh, Bob establishes the inbound session and verifies the identity binding, and both sides exchange ratcheted encrypted messages.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b4f"/></linearGradient><marker id="cipherArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#b889ff"/></marker><style>.kicker{font-family:system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;fill:#79c8ff}.heading{font-family:system-ui,sans-serif;font-size:31px;font-weight:750;fill:#f8fbff}.sub{font-family:system-ui,sans-serif;font-size:16px;fill:#b9c9dc}.actor{font-family:system-ui,sans-serif;font-size:22px;font-weight:750;fill:#fff}.label{font-family:system-ui,sans-serif;font-size:16px;font-weight:650;fill:#eef6ff}.body{font-family:system-ui,sans-serif;font-size:15px;fill:#c4d2e2}.tiny{font-family:system-ui,sans-serif;font-size:13px;fill:#9fb2c9}.actorBox{fill:#112942;stroke:#57b8ff;stroke-width:2}.private{fill:#351b2c;stroke:#ff6b7a;stroke-width:2}.cipher{fill:#2c1d4a;stroke:#b889ff;stroke-width:2}.plain{fill:#12372e;stroke:#54d8a2;stroke-width:2}.transport{fill:#292f38;stroke:#93a3b5;stroke-width:1.5}.life{stroke:#57708c;stroke-width:2;stroke-dasharray:6 8}.cipherline{stroke:#b889ff;stroke-width:3;fill:none;marker-end:url(#cipherArrow)}</style></defs>
  <rect width="1200" height="980" rx="28" fill="url(#bg)"/>
  <text class="kicker" x="48" y="47">PROTOCOL SEQUENCE · BLUETOOTH LE MESH</text><text class="heading" x="48" y="86">Olm establishes asynchronously, then ratchets every message.</text><text class="sub" x="48" y="116">BLE peers fragment, deduplicate, and forward an authenticated envelope. They never receive message keys.</text>
  <rect class="actorBox" x="88" y="157" width="304" height="66" rx="16"/><text class="actor" x="240" y="198" text-anchor="middle">Alice · pigeon-core</text><rect class="actorBox" x="808" y="157" width="304" height="66" rx="16"/><text class="actor" x="960" y="198" text-anchor="middle">Bob · pigeon-core</text>
  <rect class="private" x="78" y="244" width="324" height="96" rx="15"/><text class="label" x="240" y="274" text-anchor="middle">PRIVATE OLM STATE</text><text class="body" x="240" y="303" text-anchor="middle">account · session · ratchet keys</text><text class="tiny" x="240" y="326" text-anchor="middle">atomically sealed in the core checkpoint</text>
  <rect class="private" x="798" y="244" width="324" height="96" rx="15"/><text class="label" x="960" y="274" text-anchor="middle">PRIVATE OLM STATE</text><text class="body" x="960" y="303" text-anchor="middle">account · session · ratchet keys</text><text class="tiny" x="960" y="326" text-anchor="middle">atomically sealed in the core checkpoint</text>
  <line class="life" x1="240" y1="340" x2="240" y2="886"/><line class="life" x1="960" y1="340" x2="960" y2="886"/>
  <rect class="private" x="78" y="371" width="324" height="88" rx="14"/><text class="label" x="240" y="402" text-anchor="middle">1 · Establish outbound session</text><text class="body" x="240" y="431" text-anchor="middle">ECDH with Bob’s signed published prekeys</text>
  <rect class="transport" x="440" y="485" width="320" height="49" rx="14"/><text class="body" x="600" y="516" text-anchor="middle">BLE mesh · opaque transport</text>
  <path class="cipherline" d="M240 559 H948"/><text class="label" x="600" y="550" text-anchor="middle">2 · Olm pre-key initiation</text><text class="tiny" x="600" y="581" text-anchor="middle">sender identity bundle + ephemeral selection + first authenticated ciphertext</text>
  <rect class="private" x="798" y="616" width="324" height="105" rx="14"/><text class="label" x="960" y="647" text-anchor="middle">3 · Establish inbound session</text><text class="body" x="960" y="676" text-anchor="middle">consume one-time key · derive root</text><text class="tiny" x="960" y="703" text-anchor="middle">require session identity == verified ContactCard</text>
  <rect class="plain" x="798" y="742" width="324" height="59" rx="14"/><text class="label" x="960" y="778" text-anchor="middle">4 · Authenticate + decrypt first message</text>
  <path class="cipherline" d="M960 845 H252"/><text class="label" x="600" y="834" text-anchor="middle">5 · Normal Olm reply · next ratchet key</text><text class="tiny" x="600" y="866" text-anchor="middle">old message keys are deleted; duplicate delivery does not duplicate plaintext</text>
  <rect class="plain" x="78" y="890" width="324" height="50" rx="14"/><text class="label" x="240" y="921" text-anchor="middle">6 · Authenticate + decrypt reply</text>
  <text class="tiny" x="600" y="963" text-anchor="middle">Purple = end-to-end ciphertext · Red = private cryptographic state · Green = plaintext on an endpoint</text>
</svg>
