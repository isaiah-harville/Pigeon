<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc">
  <title id="title">Federated relay authentication and message delivery protocol</title>
  <desc id="desc">A sequence diagram. Bob subscribes to his public-key mailbox and proves ownership by signing a relay challenge. Alice deposits Olm ciphertext. The relay stores and forwards the opaque envelope, Bob processes it durably, and only then sends an acknowledgement that permits deletion.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b4f"/></linearGradient><marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#57b8ff"/></marker><marker id="purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#b889ff"/></marker><marker id="gray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#93a3b5"/></marker><style>.kicker{font-family:system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;fill:#79c8ff}.heading{font-family:system-ui,sans-serif;font-size:31px;font-weight:750;fill:#f8fbff}.sub{font-family:system-ui,sans-serif;font-size:16px;fill:#b9c9dc}.actor{font-family:system-ui,sans-serif;font-size:20px;font-weight:750;fill:#fff}.label{font-family:system-ui,sans-serif;font-size:15px;font-weight:650;fill:#eef6ff}.body{font-family:system-ui,sans-serif;font-size:14px;fill:#c4d2e2}.tiny{font-family:system-ui,sans-serif;font-size:13px;fill:#9fb2c9}.actorBox{fill:#112942;stroke:#57b8ff;stroke-width:2}.infraBox{fill:#172334;stroke:#93a3b5;stroke-width:2}.private{fill:#351b2c;stroke:#ff6b7a;stroke-width:2}.public{fill:#0e3156;stroke:#57b8ff;stroke-width:2}.cipher{fill:#2c1d4a;stroke:#b889ff;stroke-width:2}.plain{fill:#12372e;stroke:#54d8a2;stroke-width:2}.none{fill:#292f38;stroke:#93a3b5;stroke-width:1.5}.life{stroke:#57708c;stroke-width:2;stroke-dasharray:6 8}.publine{stroke:#57b8ff;stroke-width:3;fill:none;marker-end:url(#blue)}.cipherline{stroke:#b889ff;stroke-width:3;fill:none;marker-end:url(#purple)}.ackline{stroke:#93a3b5;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#gray)}</style></defs>
  <rect width="1200" height="1240" rx="28" fill="url(#bg)"/>
  <text class="kicker" x="48" y="47">PROTOCOL SEQUENCE · FEDERATED RELAY</text><text class="heading" x="48" y="86">Mailbox ownership is authenticated; message content stays end to end.</text><text class="sub" x="48" y="116">The relay is a durable courier outside the confidentiality, authenticity, and integrity boundary.</text>
  <rect class="actorBox" x="34" y="157" width="232" height="66" rx="16"/><text class="actor" x="150" y="198" text-anchor="middle">Alice · client</text>
  <rect class="infraBox" x="484" y="157" width="232" height="66" rx="16"/><text class="actor" x="600" y="198" text-anchor="middle">Relay · untrusted</text>
  <rect class="actorBox" x="934" y="157" width="232" height="66" rx="16"/><text class="actor" x="1050" y="198" text-anchor="middle">Bob · client</text>
  <rect class="private" x="28" y="244" width="244" height="85" rx="14"/><text class="label" x="150" y="274" text-anchor="middle">PRIVATE OLM STATE</text><text class="body" x="150" y="303" text-anchor="middle">keys stay on Alice’s device</text>
  <rect class="none" x="478" y="244" width="244" height="85" rx="14"/><text class="label" x="600" y="274" text-anchor="middle">HOLDS NO MESSAGE KEYS</text><text class="body" x="600" y="303" text-anchor="middle">public addresses + ciphertext</text>
  <rect class="private" x="928" y="244" width="244" height="85" rx="14"/><text class="label" x="1050" y="274" text-anchor="middle">PRIVATE IDENTITY + OLM</text><text class="body" x="1050" y="303" text-anchor="middle">sign + authenticate + decrypt</text>
  <line class="life" x1="150" y1="329" x2="150" y2="1126"/><line class="life" x1="600" y1="329" x2="600" y2="1126"/><line class="life" x1="1050" y1="329" x2="1050" y2="1126"/>
  <path class="publine" d="M1050 380 H612"/><text class="label" x="825" y="367" text-anchor="middle">1 · Subscribe (public mailbox key)</text>
  <path class="publine" d="M600 447 H1038"/><text class="label" x="825" y="434" text-anchor="middle">2 · Fresh random challenge nonce</text>
  <rect class="private" x="928" y="478" width="244" height="70" rx="14"/><text class="label" x="1050" y="506" text-anchor="middle">3 · Sign nonce locally</text><text class="body" x="1050" y="532" text-anchor="middle">Ed25519 private key is not sent</text>
  <path class="publine" d="M1050 590 H612"/><text class="label" x="825" y="577" text-anchor="middle">4 · Ed25519 signature</text><text class="tiny" x="825" y="610" text-anchor="middle">proves control of the mailbox public key</text>
  <path class="publine" d="M600 660 H1038"/><text class="label" x="825" y="647" text-anchor="middle">5 · Subscription authenticated</text>
  <rect class="private" x="28" y="693" width="244" height="72" rx="14"/><text class="label" x="150" y="722" text-anchor="middle">6 · Olm encrypt + ratchet</text><text class="body" x="150" y="749" text-anchor="middle">authenticate message end to end</text>
  <path class="cipherline" d="M150 814 H588"/><text class="label" x="375" y="801" text-anchor="middle">7 · Deposit opaque ciphertext</text><text class="tiny" x="375" y="834" text-anchor="middle">addressed to Bob’s public mailbox</text>
  <rect class="cipher" x="478" y="860" width="244" height="86" rx="14"/><text class="label" x="600" y="891" text-anchor="middle">8 · Store until ACK / expiry</text><text class="body" x="600" y="920" text-anchor="middle">configurable · 30-day default</text>
  <path class="cipherline" d="M600 987 H1038"/><text class="label" x="825" y="974" text-anchor="middle">9 · Deliver unchanged ciphertext</text>
  <rect class="plain" x="928" y="1020" width="244" height="77" rx="14"/><text class="label" x="1050" y="1049" text-anchor="middle">10 · Authenticate + decrypt</text><text class="body" x="1050" y="1076" text-anchor="middle">persist ratchet + message first</text>
  <path class="ackline" d="M1050 1142 H612"/><text class="label" x="825" y="1129" text-anchor="middle">11 · ACK persisted envelope; relay deletes it</text>
  <rect class="none" x="135" y="1174" width="930" height="42" rx="13"/><text class="tiny" x="600" y="1200" text-anchor="middle">Relay-visible metadata: mailbox address · ciphertext size · timing · connection metadata · Never visible: plaintext or message keys</text>
</svg>
