<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Olm direct messaging over planned local Wi-Fi transport</title>
  <desc id="desc">A sequence diagram showing the same asynchronous Olm pre-key session and ratcheted reply as Bluetooth, carried directly over a planned peer-to-peer local Wi-Fi transport.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b4f"/></linearGradient><marker id="cipherArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#b889ff"/></marker><style>.kicker{font-family:system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;fill:#79c8ff}.heading{font-family:system-ui,sans-serif;font-size:31px;font-weight:750;fill:#f8fbff}.sub{font-family:system-ui,sans-serif;font-size:16px;fill:#b9c9dc}.actor{font-family:system-ui,sans-serif;font-size:22px;font-weight:750;fill:#fff}.label{font-family:system-ui,sans-serif;font-size:16px;font-weight:650;fill:#eef6ff}.body{font-family:system-ui,sans-serif;font-size:15px;fill:#c4d2e2}.tiny{font-family:system-ui,sans-serif;font-size:13px;fill:#9fb2c9}.actorBox{fill:#112942;stroke:#57b8ff;stroke-width:2}.private{fill:#351b2c;stroke:#ff6b7a;stroke-width:2}.cipher{fill:#2c1d4a;stroke:#b889ff;stroke-width:2}.plain{fill:#12372e;stroke:#54d8a2;stroke-width:2}.transport{fill:#292f38;stroke:#93a3b5;stroke-width:1.5}.life{stroke:#57708c;stroke-width:2;stroke-dasharray:6 8}.cipherline{stroke:#b889ff;stroke-width:3;fill:none;marker-end:url(#cipherArrow)}</style></defs>
  <rect width="1200" height="900" rx="28" fill="url(#bg)"/>
  <text class="kicker" x="48" y="47">PLANNED PROTOCOL SEQUENCE · LOCAL WI-FI</text><text class="heading" x="48" y="86">The link changes. The cryptographic transcript does not.</text><text class="sub" x="48" y="116">Peer-to-peer LAN delivery carries the same Olm bytes as BLE or relay, without a Pigeon server.</text>
  <rect class="actorBox" x="88" y="157" width="304" height="66" rx="16"/><text class="actor" x="240" y="198" text-anchor="middle">Alice · pigeon-core</text><rect class="actorBox" x="808" y="157" width="304" height="66" rx="16"/><text class="actor" x="960" y="198" text-anchor="middle">Bob · pigeon-core</text>
  <rect class="private" x="78" y="244" width="324" height="84" rx="15"/><text class="label" x="240" y="275" text-anchor="middle">PRIVATE OLM STATE</text><text class="body" x="240" y="304" text-anchor="middle">session + evolving ratchet</text><rect class="private" x="798" y="244" width="324" height="84" rx="15"/><text class="label" x="960" y="275" text-anchor="middle">PRIVATE OLM STATE</text><text class="body" x="960" y="304" text-anchor="middle">session + evolving ratchet</text>
  <line class="life" x1="240" y1="328" x2="240" y2="823"/><line class="life" x1="960" y1="328" x2="960" y2="823"/>
  <rect class="private" x="78" y="363" width="324" height="82" rx="14"/><text class="label" x="240" y="394" text-anchor="middle">1 · Derive outbound Olm session</text><text class="body" x="240" y="423" text-anchor="middle">Bob’s signed published prekeys</text>
  <rect class="transport" x="420" y="478" width="360" height="51" rx="14"/><text class="body" x="600" y="510" text-anchor="middle">Local Wi-Fi / LAN · opaque peer transport</text>
  <path class="cipherline" d="M240 560 H948"/><text class="label" x="600" y="550" text-anchor="middle">2 · Olm pre-key initiation + first ciphertext</text><text class="tiny" x="600" y="582" text-anchor="middle">identical end-to-end encoding; only the courier differs</text>
  <rect class="private" x="798" y="616" width="324" height="88" rx="14"/><text class="label" x="960" y="647" text-anchor="middle">3 · Verify binding + establish inbound</text><text class="body" x="960" y="676" text-anchor="middle">authenticate before releasing plaintext</text>
  <path class="cipherline" d="M960 752 H252"/><text class="label" x="600" y="742" text-anchor="middle">4 · Ratcheted encrypted reply</text><text class="tiny" x="600" y="774" text-anchor="middle">LAN observers see ciphertext size and timing, never message keys or content</text>
  <rect class="plain" x="78" y="804" width="324" height="50" rx="14"/><text class="label" x="240" y="835" text-anchor="middle">5 · Authenticate + decrypt on device</text>
  <text class="tiny" x="600" y="883" text-anchor="middle">Transport-pluggable means one protocol transcript, not one encryption scheme per network.</text>
</svg>
