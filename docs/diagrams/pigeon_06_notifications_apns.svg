<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc">
  <title id="title">Content-free APNs wake protocol</title>
  <desc id="desc">A sequence diagram. Push wake-ups are enabled by default and can be disabled. When enabled, Bob registers an opaque APNs token with an official Pigeon relay. Alice deposits ciphertext. The relay sends only the token to APNs, APNs wakes Bob without content, and Bob authenticates to fetch the ciphertext. Decryption and acknowledgement wait for durable local processing.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b4f"/></linearGradient><marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#57b8ff"/></marker><marker id="purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#b889ff"/></marker><marker id="gray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#93a3b5"/></marker><style>.kicker{font-family:system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;fill:#79c8ff}.heading{font-family:system-ui,sans-serif;font-size:31px;font-weight:750;fill:#f8fbff}.sub{font-family:system-ui,sans-serif;font-size:16px;fill:#b9c9dc}.actor{font-family:system-ui,sans-serif;font-size:18px;font-weight:750;fill:#fff}.label{font-family:system-ui,sans-serif;font-size:14px;font-weight:650;fill:#eef6ff}.body{font-family:system-ui,sans-serif;font-size:13px;fill:#c4d2e2}.tiny{font-family:system-ui,sans-serif;font-size:12px;fill:#9fb2c9}.actorBox{fill:#112942;stroke:#57b8ff;stroke-width:2}.infraBox{fill:#172334;stroke:#93a3b5;stroke-width:2}.private{fill:#351b2c;stroke:#ff6b7a;stroke-width:2}.public{fill:#0e3156;stroke:#57b8ff;stroke-width:2}.cipher{fill:#2c1d4a;stroke:#b889ff;stroke-width:2}.plain{fill:#12372e;stroke:#54d8a2;stroke-width:2}.none{fill:#292f38;stroke:#93a3b5;stroke-width:1.5}.life{stroke:#57708c;stroke-width:2;stroke-dasharray:6 8}.publine{stroke:#57b8ff;stroke-width:3;fill:none;marker-end:url(#blue)}.cipherline{stroke:#b889ff;stroke-width:3;fill:none;marker-end:url(#purple)}.ackline{stroke:#93a3b5;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#gray)}</style></defs>
  <rect width="1200" height="1240" rx="28" fill="url(#bg)"/>
  <text class="kicker" x="48" y="47">PROTOCOL SEQUENCE · USER-CONTROLLABLE APNs WAKE</text><text class="heading" x="48" y="86">The push is a doorbell, never a message carrier.</text><text class="sub" x="48" y="116">APNs receives an opaque device token and timing only. Pigeon ciphertext stays between client and relay.</text>
  <rect class="actorBox" x="22" y="157" width="196" height="66" rx="15"/><text class="actor" x="120" y="198" text-anchor="middle">Alice · client</text><rect class="infraBox" x="342" y="157" width="196" height="66" rx="15"/><text class="actor" x="440" y="198" text-anchor="middle">Official relay</text><rect class="infraBox" x="662" y="157" width="196" height="66" rx="15"/><text class="actor" x="760" y="198" text-anchor="middle">Apple · APNs</text><rect class="actorBox" x="982" y="157" width="196" height="66" rx="15"/><text class="actor" x="1080" y="198" text-anchor="middle">Bob · locked</text>
  <rect class="private" x="12" y="244" width="216" height="76" rx="14"/><text class="label" x="120" y="274" text-anchor="middle">PRIVATE OLM STATE</text><text class="body" x="120" y="301" text-anchor="middle">encrypts locally</text><rect class="none" x="332" y="244" width="216" height="76" rx="14"/><text class="label" x="440" y="274" text-anchor="middle">MAILBOX + PUSH KEY</text><text class="body" x="440" y="301" text-anchor="middle">no message keys</text><rect class="none" x="652" y="244" width="216" height="76" rx="14"/><text class="label" x="760" y="274" text-anchor="middle">APPLE INFRASTRUCTURE</text><text class="body" x="760" y="301" text-anchor="middle">never gets ciphertext</text><rect class="private" x="972" y="244" width="216" height="76" rx="14"/><text class="label" x="1080" y="274" text-anchor="middle">VAULT LOCKED</text><text class="body" x="1080" y="301" text-anchor="middle">no cold-launch decrypt</text>
  <line class="life" x1="120" y1="320" x2="120" y2="1132"/><line class="life" x1="440" y1="320" x2="440" y2="1132"/><line class="life" x1="760" y1="320" x2="760" y2="1132"/><line class="life" x1="1080" y1="320" x2="1080" y2="1132"/>
  <rect class="public" x="972" y="353" width="216" height="53" rx="13"/><text class="label" x="1080" y="386" text-anchor="middle">0 · Default on · can disable</text>
  <path class="publine" d="M1080 450 H452"/><text class="label" x="760" y="437" text-anchor="middle">1 · Register APNs token + public mailbox</text>
  <rect class="none" x="332" y="478" width="216" height="66" rx="13"/><text class="label" x="440" y="505" text-anchor="middle">2 · Store mapping</text><text class="body" x="440" y="530" text-anchor="middle">rate-limited metadata</text>
  <rect class="private" x="12" y="582" width="216" height="66" rx="13"/><text class="label" x="120" y="609" text-anchor="middle">3 · Olm encrypt + ratchet</text><text class="body" x="120" y="634" text-anchor="middle">message stays end to end</text>
  <path class="cipherline" d="M120 693 H428"/><text class="label" x="280" y="680" text-anchor="middle">4 · Deposit ciphertext</text>
  <path class="publine" d="M440 765 H748"/><text class="label" x="600" y="752" text-anchor="middle">5 · Token-only blank push</text><text class="tiny" x="600" y="783" text-anchor="middle">no mailbox address, sender, or content</text>
  <path class="publine" d="M760 837 H1068"/><text class="label" x="920" y="824" text-anchor="middle">6 · Content-free wake</text>
  <rect class="private" x="972" y="865" width="216" height="66" rx="13"/><text class="label" x="1080" y="892" text-anchor="middle">7 · Show “New message”</text><text class="body" x="1080" y="917" text-anchor="middle">no sender or preview</text>
  <path class="publine" d="M1080 975 H452"/><text class="label" x="760" y="962" text-anchor="middle">8 · Authenticate mailbox + fetch</text>
  <path class="cipherline" d="M440 1047 H1068"/><text class="label" x="760" y="1034" text-anchor="middle">9 · Deliver opaque ciphertext</text>
  <rect class="plain" x="952" y="1075" width="256" height="70" rx="13"/><text class="label" x="1080" y="1103" text-anchor="middle">10 · Unlock, decrypt, persist</text><text class="body" x="1080" y="1129" text-anchor="middle">then ACK relay envelope</text>
  <path class="ackline" d="M1080 1178 H452"/><text class="label" x="760" y="1165" text-anchor="middle">11 · ACK only after durable processing</text>
  <text class="tiny" x="600" y="1216" text-anchor="middle">APNs visibility: opaque token + wake timing · Relay visibility: mailbox + ciphertext metadata · Neither can read the message</text>
</svg>
