<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1040" viewBox="0 0 1320 1040" role="img" aria-labelledby="title desc">
  <title id="title">Creator-independent MLS coordinator recovery</title>
  <desc id="desc">A sequence diagram showing an administrator proposing a replacement relay and coordinator, a strict majority of non-owner administrators signing the exact last agreed group context, the replacement deployment registering fresh capabilities and ordering one recovery commit, and every member verifying the certificate and signed receipt before switching.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b4f"/></linearGradient>
    <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#57b8ff"/></marker>
    <marker id="green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#54d8a2"/></marker>
    <style>.kicker{font-family:system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;fill:#79c8ff}.heading{font-family:system-ui,sans-serif;font-size:31px;font-weight:750;fill:#f8fbff}.sub{font-family:system-ui,sans-serif;font-size:16px;fill:#b9c9dc}.actor{font-family:system-ui,sans-serif;font-size:17px;font-weight:750;fill:#fff}.label{font-family:system-ui,sans-serif;font-size:14px;font-weight:650;fill:#eef6ff}.body{font-family:system-ui,sans-serif;font-size:13px;fill:#c4d2e2}.tiny{font-family:system-ui,sans-serif;font-size:12px;fill:#9fb2c9}.client{fill:#112942;stroke:#57b8ff;stroke-width:2}.relay{fill:#172334;stroke:#93a3b5;stroke-width:2}.context{fill:#2c1d4a;stroke:#b889ff;stroke-width:2}.verified{fill:#12372e;stroke:#54d8a2;stroke-width:2}.warning{fill:#351b2c;stroke:#ff6b7a;stroke-width:2}.life{stroke:#57708c;stroke-width:2;stroke-dasharray:6 8}.request{stroke:#57b8ff;stroke-width:3;fill:none;marker-end:url(#blue)}.success{stroke:#54d8a2;stroke-width:3;fill:none;marker-end:url(#green)}</style>
  </defs>
  <rect width="1320" height="1040" rx="28" fill="url(#bg)"/>
  <text class="kicker" x="48" y="47">FAILOVER SEQUENCE · AUTHENTICATED RECOVERY</text>
  <text class="heading" x="48" y="86">The permanent owner is not a recovery bottleneck.</text>
  <text class="sub" x="48" y="116">Recovery changes only relay/coordinator binding and capabilities; it preserves roster, roles, name, mesh setting, history, and MLS identity.</text>

  <rect class="client" x="26" y="158" width="220" height="68" rx="15"/><text class="actor" x="136" y="189" text-anchor="middle">Initiating admin</text><text class="tiny" x="136" y="211" text-anchor="middle">last accepted epoch E</text>
  <rect class="client" x="346" y="158" width="220" height="68" rx="15"/><text class="actor" x="456" y="189" text-anchor="middle">Other admins</text><text class="tiny" x="456" y="211" text-anchor="middle">independent recovery keys</text>
  <rect class="relay" x="666" y="158" width="220" height="68" rx="15"/><text class="actor" x="776" y="189" text-anchor="middle">Replacement relay</text><text class="tiny" x="776" y="211" text-anchor="middle">mailbox + coordinator</text>
  <rect class="client" x="986" y="158" width="188" height="68" rx="15"/><text class="actor" x="1080" y="189" text-anchor="middle">All members</text><text class="tiny" x="1080" y="211" text-anchor="middle">same MLS group</text>
  <line class="life" x1="136" y1="226" x2="136" y2="930"/><line class="life" x1="456" y1="226" x2="456" y2="930"/><line class="life" x1="776" y1="226" x2="776" y2="930"/><line class="life" x1="1080" y1="226" x2="1080" y2="930"/>

  <rect class="context" x="26" y="264" width="220" height="155" rx="15"/>
  <text class="label" x="136" y="294" text-anchor="middle">1 · Freeze exact context</text>
  <text class="body" x="136" y="321" text-anchor="middle">group + epoch E</text><text class="body" x="136" y="345" text-anchor="middle">policy + roster hashes</text><text class="body" x="136" y="369" text-anchor="middle">last receipt hash</text><text class="body" x="136" y="393" text-anchor="middle">new URL + coordinator key</text>

  <path class="request" d="M136 466 H444"/><text class="label" x="290" y="453" text-anchor="middle">2 · MLS-encrypted proposal</text>
  <rect class="verified" x="346" y="494" width="220" height="118" rx="15"/><text class="label" x="456" y="524" text-anchor="middle">3 · Verify before signing</text><text class="body" x="456" y="551" text-anchor="middle">current admin · exact context</text><text class="body" x="456" y="575" text-anchor="middle">fresh binding · no policy edits</text><text class="tiny" x="456" y="598" text-anchor="middle">removed/stale signers fail</text>
  <path class="success" d="M456 654 H148"/><text class="label" x="302" y="641" text-anchor="middle">4 · Recovery-key endorsement</text>
  <rect class="verified" x="26" y="680" width="220" height="111" rx="15"/><text class="label" x="136" y="710" text-anchor="middle">5 · Form certificate</text><text class="body" x="136" y="737" text-anchor="middle">strict majority of current</text><text class="body" x="136" y="761" text-anchor="middle">non-owner admins</text><text class="tiny" x="136" y="783" text-anchor="middle">owner only if none exist</text>
  <path class="request" d="M136 831 H764"/><text class="label" x="450" y="818" text-anchor="middle">6 · Register rotated capabilities + submit recovery commit</text>
  <rect class="relay" x="666" y="832" width="220" height="78" rx="15"/><text class="label" x="776" y="862" text-anchor="middle">7 · Order opaque candidate</text><text class="body" x="776" y="889" text-anchor="middle">signed receipt · no group keys</text>
  <path class="success" d="M776 936 H1068"/><text class="label" x="922" y="923" text-anchor="middle">8 · MLS-encrypted candidate</text>
  <rect class="verified" x="970" y="950" width="220" height="70" rx="15"/><text class="label" x="1080" y="977" text-anchor="middle">9 · Verify + merge E → E+1</text><text class="tiny" x="1080" y="1001" text-anchor="middle">persist before switching relay</text>
  <rect class="warning" x="276" y="930" width="360" height="82" rx="15"/><text class="label" x="456" y="958" text-anchor="middle">FAIL CLOSED</text><text class="tiny" x="456" y="981" text-anchor="middle">No quorum or no authenticated delivery path: wait.</text><text class="tiny" x="456" y="1002" text-anchor="middle">Never reset the group or fall back to plaintext.</text>
</svg>
