<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Pigeon MLS epoch history boundaries</title>
  <desc id="desc">Messages before Bob joins remain unavailable to Bob; after an authenticated membership commit all current members receive messages in the new epoch.</desc>
  <defs><style>.bg{fill:#f8fafc}.line{stroke:#64748b;stroke-width:5}.join{stroke:#16a34a;stroke-width:5}.leave{stroke:#dc2626;stroke-width:5}.title{font:700 25px system-ui;fill:#0f172a}.text{font:18px system-ui;fill:#334155}.label{font:700 18px system-ui;fill:#0f172a}.old{fill:#e2e8f0}.new{fill:#dcfce7}.later{fill:#dbeafe}</style></defs>
  <rect class="bg" width="1200" height="560" rx="24"/>
  <text class="title" x="42" y="52">Membership changes create cryptographic history boundaries</text>
  <line class="line" x1="90" y1="280" x2="1110" y2="280"/>
  <rect class="old" x="90" y="175" width="320" height="70" rx="16"/><text class="label" x="185" y="218">Epoch 7 · Alice + Carol</text>
  <line class="join" x1="430" y1="135" x2="430" y2="330"/><text class="label" x="375" y="115">Bob joins</text>
  <rect class="new" x="455" y="175" width="320" height="70" rx="16"/><text class="label" x="520" y="218">Epoch 8 · Alice + Bob + Carol</text>
  <line class="leave" x1="800" y1="135" x2="800" y2="330"/><text class="label" x="745" y="115">Carol leaves</text>
  <rect class="later" x="825" y="175" width="285" height="70" rx="16"/><text class="label" x="895" y="218">Epoch 9 · Alice + Bob</text>
  <text class="text" x="115" y="365">Bob cannot decrypt</text><text class="text" x="115" y="395">messages from epoch 7.</text>
  <text class="text" x="490" y="365">All current members decrypt</text><text class="text" x="490" y="395">messages from epoch 8.</text>
  <text class="text" x="850" y="365">Carol cannot decrypt</text><text class="text" x="850" y="395">messages from epoch 9.</text>
  <text class="text" x="180" y="485">Every membership or policy action is an authenticated, ordered commit that advances the group epoch.</text>
</svg>
