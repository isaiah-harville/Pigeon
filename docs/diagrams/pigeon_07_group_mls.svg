<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
  <title id="title">MLS group creation, asynchronous join, coordination, and message delivery</title>
  <desc id="desc">A sequence diagram with four lanes. The permanent owner creates authenticated MLS group state, sends pairwise-encrypted invitations to members, submits membership commits to the coordinator service, verifies its signed ordering receipt, and uploads one MLS ciphertext to the separate group message service for members to fetch.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#102b4f"/></linearGradient><marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#57b8ff"/></marker><marker id="purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11z" fill="#b889ff"/></marker><style>.kicker{font-family:system-ui,sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;fill:#79c8ff}.heading{font-family:system-ui,sans-serif;font-size:31px;font-weight:750;fill:#f8fbff}.sub{font-family:system-ui,sans-serif;font-size:16px;fill:#b9c9dc}.actor{font-family:system-ui,sans-serif;font-size:17px;font-weight:750;fill:#fff}.label{font-family:system-ui,sans-serif;font-size:14px;font-weight:650;fill:#eef6ff}.body{font-family:system-ui,sans-serif;font-size:13px;fill:#c4d2e2}.tiny{font-family:system-ui,sans-serif;font-size:12px;fill:#9fb2c9}.actorBox{fill:#112942;stroke:#57b8ff;stroke-width:2}.infraBox{fill:#172334;stroke:#93a3b5;stroke-width:2}.private{fill:#351b2c;stroke:#ff6b7a;stroke-width:2}.public{fill:#0e3156;stroke:#57b8ff;stroke-width:2}.cipher{fill:#2c1d4a;stroke:#b889ff;stroke-width:2}.policy{fill:#12372e;stroke:#54d8a2;stroke-width:2}.none{fill:#292f38;stroke:#93a3b5;stroke-width:1.5}.life{stroke:#57708c;stroke-width:2;stroke-dasharray:6 8}.pairline{stroke:#57b8ff;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#blue)}.publine{stroke:#57b8ff;stroke-width:3;fill:none;marker-end:url(#blue)}.cipherline{stroke:#b889ff;stroke-width:3;fill:none;marker-end:url(#purple)}</style></defs>
  <rect width="1200" height="1280" rx="28" fill="url(#bg)"/>
  <text class="kicker" x="48" y="47">PROTOCOL SEQUENCE · MLS GROUP CHAT</text><text class="heading" x="48" y="86">Pairwise invitation, ordered commits, one group ciphertext.</text><text class="sub" x="48" y="116">The selected relay deployment hosts two separate opaque services; neither becomes group policy authority.</text>
  <rect class="actorBox" x="18" y="157" width="204" height="66" rx="15"/><text class="actor" x="120" y="189" text-anchor="middle">Alice · owner</text><text class="tiny" x="120" y="210" text-anchor="middle">pigeon-core</text>
  <rect class="infraBox" x="318" y="157" width="244" height="66" rx="15"/><text class="actor" x="440" y="189" text-anchor="middle">Group message service</text><text class="tiny" x="440" y="210" text-anchor="middle">selected relay deployment</text>
  <rect class="infraBox" x="638" y="157" width="244" height="66" rx="15"/><text class="actor" x="760" y="189" text-anchor="middle">Commit coordinator</text><text class="tiny" x="760" y="210" text-anchor="middle">same relay deployment</text>
  <rect class="actorBox" x="978" y="157" width="204" height="66" rx="15"/><text class="actor" x="1080" y="189" text-anchor="middle">Bob + Carol</text><text class="tiny" x="1080" y="210" text-anchor="middle">member clients</text>
  <rect class="private" x="10" y="244" width="220" height="84" rx="14"/><text class="label" x="120" y="274" text-anchor="middle">PRIVATE MLS + OLM</text><text class="body" x="120" y="301" text-anchor="middle">inside pigeon-core</text><rect class="none" x="310" y="244" width="260" height="84" rx="14"/><text class="label" x="440" y="274" text-anchor="middle">OPAQUE GROUP LOG</text><text class="body" x="440" y="301" text-anchor="middle">no plaintext or keys</text><rect class="none" x="630" y="244" width="260" height="84" rx="14"/><text class="label" x="760" y="274" text-anchor="middle">ORDERING ONLY</text><text class="body" x="760" y="301" text-anchor="middle">signed receipts, no authority</text><rect class="private" x="970" y="244" width="220" height="84" rx="14"/><text class="label" x="1080" y="274" text-anchor="middle">PRIVATE MLS + OLM</text><text class="body" x="1080" y="301" text-anchor="middle">inside pigeon-core</text>
  <line class="life" x1="120" y1="328" x2="120" y2="1162"/><line class="life" x1="440" y1="328" x2="440" y2="1162"/><line class="life" x1="760" y1="328" x2="760" y2="1162"/><line class="life" x1="1080" y1="328" x2="1080" y2="1162"/>
  <rect class="policy" x="10" y="357" width="220" height="101" rx="14"/><text class="label" x="120" y="385" text-anchor="middle">1 · Create group</text><text class="body" x="120" y="411" text-anchor="middle">permanent owner · 3–128</text><text class="tiny" x="120" y="437" text-anchor="middle">name + relay · mesh off</text>
  <path class="pairline" d="M120 506 H1068"/><text class="label" x="600" y="493" text-anchor="middle">2 · Pairwise-encrypted invitation controls</text><text class="tiny" x="600" y="526" text-anchor="middle">Welcome + authenticated policy/capabilities over each existing Olm channel · members may be offline</text>
  <rect class="private" x="970" y="555" width="220" height="83" rx="14"/><text class="label" x="1080" y="584" text-anchor="middle">3 · Validate + join</text><text class="body" x="1080" y="611" text-anchor="middle">install current epoch only</text>
  <path class="publine" d="M1080 688 H452"/><text class="label" x="760" y="675" text-anchor="middle">4 · Authenticate group capability</text><text class="tiny" x="760" y="708" text-anchor="middle">message service learns an opaque group slot, not MLS membership secrets</text>
  <path class="publine" d="M120 758 H748"/><text class="label" x="440" y="745" text-anchor="middle">5 · Submit authenticated commit candidate</text>
  <rect class="public" x="630" y="789" width="260" height="82" rx="14"/><text class="label" x="760" y="818" text-anchor="middle">6 · Serialize competing candidates</text><text class="body" x="760" y="845" text-anchor="middle">monotonic sequence · signed receipt</text>
  <path class="publine" d="M760 918 H132"/><text class="label" x="440" y="905" text-anchor="middle">7 · Coordinator receipt + ordered candidate</text>
  <rect class="private" x="10" y="948" width="220" height="92" rx="14"/><text class="label" x="120" y="977" text-anchor="middle">8 · Verify before apply</text><text class="body" x="120" y="1004" text-anchor="middle">receipt · MLS commit · policy</text><text class="tiny" x="120" y="1028" text-anchor="middle">persist epoch before output</text>
  <path class="cipherline" d="M120 1083 H428"/><text class="label" x="280" y="1070" text-anchor="middle">9 · Encrypt once + append</text>
  <path class="cipherline" d="M440 1149 H1068"/><text class="label" x="760" y="1136" text-anchor="middle">10 · Members fetch the same MLS ciphertext</text>
  <rect class="private" x="970" y="1178" width="220" height="56" rx="14"/><text class="label" x="1080" y="1212" text-anchor="middle">11 · MLS authenticate + decrypt</text>
  <rect class="none" x="110" y="1245" width="980" height="25" rx="10"/><text class="tiny" x="600" y="1262" text-anchor="middle">Owner may be offline after creation · ordinary traffic does not fan out pairwise · optional local mesh carries the same MLS ciphertext</text>
</svg>
