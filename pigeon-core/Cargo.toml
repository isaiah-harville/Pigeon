[package]
name = "pigeon-core"
version = "0.1.2"
edition = "2024"
description = "Pigeon's pairwise end-to-end-encrypted messaging core (Olm via vodozemac), with an Ed25519 identity binding over Olm's Curve25519 identity key."
license = "AGPL-3.0-only"
repository = "https://github.com/isaiah-harville/Pigeon"
readme = "README.md"
# The build currently consumes the canonical schema from the workspace-level
# proto directory, which crates.io packages cannot include.
publish = false

[dependencies]
# Olm Account/Session: audited Double Ratchet + async-first prekey establishment.
vodozemac = "0.10"
prost = "0.14"
# The identity<->static binding: an Ed25519 identity key signs Olm's Curve25519
# identity key. This is the one piece of protocol trust we keep; everything
# below it (ratchet, session setup, message format) is vodozemac's.
ed25519-dalek = "2"
# Defence-in-depth wiping of any key bytes we hold outside vodozemac.
zeroize = { version = "1", features = ["zeroize_derive"] }
# OS entropy for the Ed25519 identity seed (avoids the rand_core version skew
# between the `rand` crate and ed25519-dalek 2.x).
getrandom = "0.2"
# RFC 9420 group messaging. Keep the complete crate family exact so a routine
# dependency resolution cannot silently change Pigeon's cryptographic protocol
# implementation. Draft, debug, and test-only OpenMLS features stay disabled.
openmls = { version = "=0.9.0", default-features = false }
openmls_rust_crypto = { version = "=0.6.0", default-features = false }
openmls_traits = { version = "=0.6.0", default-features = false }
openmls_basic_credential = { version = "=0.6.0", default-features = false }
tls_codec = { version = "=0.5.0", default-features = false, features = ["derive", "mls", "serde", "std"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
