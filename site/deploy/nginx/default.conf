server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /.well-known/apple-app-site-association {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # iOS opens this path in Pigeon when the app is installed. Otherwise, discard
  # the public contact-card query and send the visitor to Pigeon's App Store page.
  location = /contact {
    access_log off;
    return 302 "https://apps.apple.com/app/id6780532820#app-store";
  }

  location / {
    try_files $uri $uri/ $uri/index.html /index.html;
  }
}
